<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vault cards fixture</title>
    <style>
      /* Home Assistant 2026.11 default theme token values, read from a live instance. */
      :root {
        --primary-color: #009ac7;
        --primary-text-color: #141414;
        --secondary-text-color: #5e5e5e;
        --text-primary-color: #ffffff;
        --card-background-color: #ffffff;
        --primary-background-color: #fafafa;
        --divider-color: rgba(0, 0, 0, 0.12);
        --ha-card-background: var(--card-background-color);
        --ha-card-border-radius: 12px;
        --ha-color-focus: #009ac7;
        --ha-color-on-success-quiet: #00883c;
        --ha-color-on-success-normal: #036730;
        --ha-color-fill-success-quiet-resting: #e3f9e3;
        --ha-color-fill-success-loud-resting: #00883c;
        --ha-color-on-warning-quiet: #c94e00;
        --ha-color-on-warning-normal: #9d3800;
        --ha-color-fill-warning-quiet-resting: #fff0e4;
        --ha-color-fill-warning-loud-resting: #ff9342;
        --ha-color-on-danger-quiet: #dc3146;
        --ha-color-on-danger-normal: #b30532;
        --ha-color-fill-danger-quiet-resting: #fff0ef;
        --ha-color-fill-danger-loud-resting: #dc3146;
        --ha-color-on-neutral-quiet: #7a7a7a;
        --ha-color-on-neutral-normal: #5e5e5e;
        --ha-color-fill-neutral-quiet-resting: #f3f3f3;
        --ha-color-fill-neutral-normal-resting: #e6e6e6;
        --ha-color-fill-neutral-loud-resting: #5e5e5e;
        --ha-color-on-primary-quiet: #18bcf2;
        --ha-color-on-primary-normal: #009ac7;
        --ha-color-fill-primary-quiet-resting: #eff9fe;
        --ha-color-fill-primary-loud-resting: #009ac7;
      }
      :root[data-theme="dark"] {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c;
        --primary-background-color: #111111;
        --divider-color: rgba(255, 255, 255, 0.12);
        --ha-color-on-success-quiet: #5dc36f;
        --ha-color-on-success-normal: #00ac49;
        --ha-color-fill-success-quiet-resting: #031608;
        --ha-color-on-warning-quiet: #ff9342;
        --ha-color-on-warning-normal: #f36d00;
        --ha-color-fill-warning-quiet-resting: #280700;
        --ha-color-on-danger-quiet: #fd8f90;
        --ha-color-on-danger-normal: #f3676c;
        --ha-color-fill-danger-quiet-resting: #2a040b;
        --ha-color-on-neutral-quiet: #b1b1b1;
        --ha-color-on-neutral-normal: #989898;
        --ha-color-fill-neutral-quiet-resting: #141414;
        --ha-color-on-primary-quiet: #7bd4fb;
        --ha-color-on-primary-normal: #37c8fd;
        --ha-color-fill-primary-quiet-resting: #001721;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
      }
      /* Stand-in for Home Assistant's ha-card. */
      ha-card {
        display: block;
        background: var(--ha-card-background);
        border-radius: var(--ha-card-border-radius);
        border: 1px solid var(--divider-color);
      }
      #container {
        display: grid;
        gap: 12px;
      }
      .slot {
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <script type="module">
      import "/vault-cards.js";
      import { buildHass } from "/test/browser/mock-hass.js";

      const TAGS = [
        "vault-health-card",
        "vault-protected-card",
        "vault-next-run-card",
        "vault-last-backup-card",
        "vault-progress-card",
        "vault-jobs-card",
        "vault-activity-card",
        "vault-storage-card",
        "vault-anomalies-card",
        "vault-rules-card",
        "vault-dashboard-card",
      ];

      window.events = [];
      for (const type of ["hass-more-info", "hass-notification"]) {
        window.addEventListener(type, (event) => window.events.push({ type, detail: event.detail }));
      }

      /**
       * Render cards for a scenario. `layout` gives each card a slot width in
       * pixels, like a sections grid column; omit it for full width.
       */
      window.render = async (scenario = "healthy", options = {}) => {
        const container = document.getElementById("container");
        container.replaceChildren();
        const { hass, calls } = buildHass(scenario, { ...options, connection: {} });
        window.calls = calls;
        window.hass = hass;
        const tags = options.tags ?? TAGS;
        for (const tag of tags) {
          const slot = document.createElement("div");
          slot.className = "slot";
          if (options.width) slot.style.width = `${options.width}px`;
          const card = document.createElement(tag);
          card.id = tag;
          card.setConfig({ type: `custom:${tag}`, ...(options.config ?? {}) });
          card.hass = hass;
          slot.append(card);
          container.append(slot);
        }
        // Let the entity map load and the cards render.
        await new Promise((resolve) => setTimeout(resolve, 0));
        await Promise.all([...container.querySelectorAll(tags.join(","))].map((card) => card.updateComplete));
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      };

      /** Replace hass on every card, keeping the same connection so the entity map is reused. */
      window.updateHass = async (mutate) => {
        const next = { ...window.hass, states: { ...window.hass.states } };
        mutate(next);
        window.hass = next;
        const cards = [...document.querySelectorAll(TAGS.join(","))];
        for (const card of cards) card.hass = next;
        await Promise.all(cards.map((card) => card.updateComplete));
      };

      window.fixtureReady = true;
    </script>
  </body>
</html>
