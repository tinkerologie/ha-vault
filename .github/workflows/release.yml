name: Release

# Builds vault.zip, the asset HACS and the Marketplace install (hacs.json names
# it), attests its build provenance, and publishes it with SHA256SUMS and
# CHANGELOG.md as an immutable release.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - custom_components/vault/manifest.json

permissions:
  contents: read # jobs request only what they need

# One release run at a time, never cancelled: the tag comes from manifest.json
# inside the job, so runs are serialised as a whole. A run must not delete or
# publish a draft another run is still filling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the release commit
      id-token: write # mint the OIDC token that signs the attestation
      attestations: write # store the build provenance attestation
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from manifest
        id: version
        run: |
          VERSION="$(jq -r '.version' custom_components/vault/manifest.json)"

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Manifest version is missing."
            exit 1
          fi

          # Accept Home Assistant style numeric segments: YYYY.M.D or YYYY.MM.DD
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "Manifest version '$VERSION' does not match expected format YYYY.MM.DD (or single-digit month/day)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/${VERSION_TAG}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION_TAG} already exists. Skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release zip
        if: steps.tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Timestamps come from the release commit, so the tag rebuilds byte-identically.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          python3 script/build_release_zip.py --output-dir dist --version "$TAG"

      - name: Attest build provenance
        if: steps.tag.outputs.exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/vault.zip

      - name: Upload release assets
        if: steps.tag.outputs.exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft, upload assets, publish the release and tag
      attestations: read # verify the attestation before publishing
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify checksum and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          # The same command the README gives users, pinned to this workflow.
          gh attestation verify dist/vault.zip --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml"

      - name: Extract latest changelog section
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          NOTES: ${{ runner.temp }}/release_notes.md
          SECTION: ${{ runner.temp }}/section.md
        run: |
          FOOTER="See [CHANGELOG.md](https://github.com/${REPOSITORY}/blob/${TAG}/CHANGELOG.md) for the full changelog."

          fallback_notes() {
            {
              echo "Release ${TAG}"
              echo
              echo "---"
              echo
              echo "$FOOTER"
            } > "$NOTES"
          }

          if [[ ! -f CHANGELOG.md ]]; then
            fallback_notes
            exit 0
          fi

          # Normalize a dotted version by stripping leading zeros from each
          # segment, so the manifest version (2026.6.1) matches zero-padded
          # changelog headings ([2026.06.01]).
          norm() {
            awk -F. -v OFS=. '{ for (i = 1; i <= NF; i++) $i += 0; print }' <<< "$1"
          }

          target="$(norm "$VERSION")"

          # Locate the changelog section for this release: headings look like
          # "## [2026.06.01] - 2026-06-13". Prefer the section matching the
          # manifest version; fall back to the first versioned section.
          start="" end="" first_start="" first_end=""
          while IFS=: read -r lineno text; do
            if [[ -n "$start" && -z "$end" && "$lineno" -gt "$start" ]]; then
              end="$lineno"
            fi
            if [[ -n "$first_start" && -z "$first_end" && "$lineno" -gt "$first_start" ]]; then
              first_end="$lineno"
            fi
            ver="$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' <<< "$text")"
            [[ -z "$ver" ]] && continue
            [[ -z "$first_start" ]] && first_start="$lineno"
            if [[ -z "$start" && "$(norm "$ver")" == "$target" ]]; then
              start="$lineno"
            fi
          done < <(grep -n '^## \[' CHANGELOG.md)

          if [[ -z "$start" ]]; then
            echo "No changelog section found for version ${VERSION}; falling back to the first versioned section."
            start="$first_start"
            end="$first_end"
          fi

          if [[ -z "$start" ]]; then
            echo "No versioned changelog section found at all."
            fallback_notes
            exit 0
          fi

          if [[ -n "$end" ]]; then
            sed -n "$((start + 1)),$((end - 1))p" CHANGELOG.md > "$SECTION"
          else
            sed -n "$((start + 1)),\$p" CHANGELOG.md > "$SECTION"
          fi

          # Trim leading and trailing blank lines
          awk 'NF { seen = 1 } seen' "$SECTION" | tac | awk 'NF { seen = 1 } seen' | tac > "$NOTES"

          if [[ ! -s "$NOTES" ]]; then
            echo "Matched changelog section is empty."
            fallback_notes
            exit 0
          fi

          {
            echo
            echo "---"
            echo
            echo "$FOOTER"
          } >> "$NOTES"

          echo "----- release notes -----"
          cat "$NOTES"
          echo "-------------------------"

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          NOTES: ${{ runner.temp }}/release_notes.md
        run: |
          # A rerun after a failed publish finds the earlier run's draft for
          # this tag (the tag itself only exists once a release is published):
          # delete it so the rerun starts from one clean draft.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # Immutable releases lock assets on publish, so upload to a draft first.
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            dist/vault.zip \
            dist/SHA256SUMS \
            CHANGELOG.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

      - name: Verify the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # GitHub creates the release attestation shortly after publication, so
          # retry for about a minute. A release published without immutability
          # never gets one, so the step still fails and the setting can't lapse
          # unnoticed.
          for attempt in $(seq 1 12); do
            if gh release verify "$TAG"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::No release attestation for $TAG. Is release immutability enabled?"
              exit 1
            fi
            echo "Release attestation not available yet (attempt $attempt/12); retrying in 5 seconds."
            sleep 5
          done
          gh release verify-asset "$TAG" dist/vault.zip
